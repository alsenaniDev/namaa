kind = "web"
previewPath = "/pages/"
title = "Namaa — Support & Privacy"
version = "1.0.0"
id = "artifacts/namaa-pages"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/pages/" ]
localPort = 18877

[services.development]
run = "pnpm --filter @workspace/namaa-pages run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/namaa-pages", "run", "build" ]
publicDir = "artifacts/namaa-pages/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18877"
BASE_PATH = "/pages/"
